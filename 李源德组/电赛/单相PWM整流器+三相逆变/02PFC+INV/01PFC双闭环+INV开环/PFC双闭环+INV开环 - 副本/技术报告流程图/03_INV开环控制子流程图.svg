<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1200" viewBox="0 0 2200 1200">
  <defs>
    <style>
      .title{font:700 50px SimSun,Microsoft YaHei,sans-serif;fill:#20252b}.sub{font:27px SimSun,Microsoft YaHei,sans-serif;fill:#59636e}
      .box{stroke:#343a40;stroke-width:3;rx:16;ry:16}.txt{font:29px SimSun,Microsoft YaHei,sans-serif;fill:#20252b;text-anchor:middle;dominant-baseline:middle}
      .small{font:24px SimSun,Microsoft YaHei,sans-serif;fill:#343a40;text-anchor:middle}.arr{fill:none;stroke:#3d4650;stroke-width:4;marker-end:url(#a)}
      .fault{fill:none;stroke:#c9574c;stroke-width:5;marker-end:url(#r)}.red{fill:#f3d8d4}.blue{fill:#dceaf5}.yellow{fill:#f5edcf}.gray{fill:#eef2f5}
    </style>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3d4650"/></marker>
    <marker id="r" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#c9574c"/></marker>
  </defs>
  <rect width="2200" height="1200" fill="#fff"/>
  <text x="1100" y="75" class="title" text-anchor="middle">三相逆变开环控制流程</text>
  <text x="1100" y="118" class="sub" text-anchor="middle">实测VBUS前馈 + 32位DDS + CBSVPWM，控制频率10 kHz</text>

  <rect x="70" y="190" width="330" height="120" class="box blue"/>
  <text x="235" y="235" class="txt"><tspan x="235">HRTIM Trigger 2</tspan><tspan x="235" dy="38">10 kHz同步触发</tspan></text>
  <path d="M400 250H465" class="arr"/>
  <rect x="465" y="165" width="430" height="170" class="box blue"/>
  <text x="680" y="205" class="small"><tspan x="680">ADC3：IU / VUV</tspan><tspan x="680" dy="34">ADC4：IV / VVW</tspan><tspan x="680" dy="34">ADC5：IW / VWU</tspan><tspan x="680" dy="34">三路循环DMA</tspan></text>
  <path d="M895 250H960" class="arr"/>
  <polygon points="1130,175 1310,250 1130,325 950,250" class="yellow" stroke="#343a40" stroke-width="3"/>
  <text x="1130" y="238" class="small"><tspan x="1130">ADC3/4/5均为新序列？</tspan><tspan x="1130" dy="32">只允许每帧控制一次</tspan></text>
  <text x="1335" y="235" class="small">是</text>
  <path d="M1310 250H1390" class="arr"/>
  <rect x="1390" y="190" width="350" height="120" class="box blue"/>
  <text x="1565" y="235" class="txt"><tspan x="1565">发布六通道一致性快照</tspan><tspan x="1565" dy="38">推进INV控制心跳</tspan></text>
  <text x="1125" y="365" class="small">否：等待其余ADC回调</text>

  <path d="M1565 310V410H400" class="arr"/>
  <polygon points="400,405 590,490 400,575 210,490" class="yellow" stroke="#343a40" stroke-width="3"/>
  <text x="400" y="472" class="small"><tspan x="400">ADC1 VBUS快照有效？</tspan><tspan x="400" dy="32">未过期、未欠压/过压</tspan></text>
  <text x="625" y="475" class="small">是</text>
  <path d="M590 490H665" class="arr"/>
  <rect x="665" y="425" width="350" height="130" class="box red"/>
  <text x="840" y="470" class="txt"><tspan x="840">32位DDS</tspan><tspan x="840" dy="38">产生30 Hz或60 Hz三相参考</tspan></text>
  <path d="M1015 490H1085" class="arr"/>
  <rect x="1085" y="425" width="330" height="130" class="box red"/>
  <text x="1250" y="470" class="txt"><tspan x="1250">施加1 s软启动</tspan><tspan x="1250" dy="38">幅值从0平滑增加</tspan></text>
  <path d="M1415 490H1485" class="arr"/>
  <rect x="1485" y="425" width="400" height="130" class="box red"/>
  <text x="1685" y="470" class="txt"><tspan x="1685">按实测VBUS计算三相电压指令</tspan><tspan x="1685" dy="38">调制度限制≤0.90</tspan></text>

  <path d="M1685 555V700H1450" class="arr"/>
  <rect x="1020" y="635" width="430" height="130" class="box red"/>
  <text x="1235" y="680" class="txt"><tspan x="1235">CBSVPWM_Calc3Leg()</tspan><tspan x="1235" dy="38">计算U/V/W占空比与零序量</tspan></text>
  <path d="M1020 700H940" class="arr"/>
  <polygon points="750,615 940,700 750,785 560,700" class="yellow" stroke="#343a40" stroke-width="3"/>
  <text x="750" y="682" class="small"><tspan x="750">valid=1且占空比合法？</tspan><tspan x="750" dy="32">无持续限幅/非有限数</tspan></text>
  <text x="515" y="684" class="small">是</text>
  <path d="M560 700H480" class="arr"/>
  <rect x="70" y="635" width="410" height="130" class="box red"/>
  <text x="275" y="680" class="txt"><tspan x="275">INV_HRTIM_SetDuty()</tspan><tspan x="275" dy="38">更新C/D/E Compare预装载</tspan></text>

  <path d="M275 765V880" class="arr"/>
  <rect x="70" y="880" width="570" height="130" class="box gray"/>
  <text x="355" y="925" class="txt"><tspan x="355">HRTIM周期边界同步生效</tspan><tspan x="355" dy="38">输出10 kHz互补PWM及30/60 Hz包络</tspan></text>

  <rect x="1460" y="850" width="640" height="180" class="box" fill="#f7e6e3"/>
  <text x="1780" y="900" class="txt"><tspan x="1780">任一校验失败</tspan><tspan x="1780" dy="40">锁存INV/联合故障</tspan><tspan x="1780" dy="40">关闭HRTIM A～E，禁止自动恢复</tspan></text>
  <text x="410" y="625" class="small">否</text>
  <path d="M400 575V820H1780V850" class="fault"/>
  <text x="965" y="685" class="small">否</text>
  <path d="M750 785V820H1780V850" class="fault"/>

  <rect x="760" y="1045" width="680" height="95" rx="18" fill="#f8fafb" stroke="#91a0ad" stroke-width="2"/>
  <text x="1100" y="1092" class="small">相序：U → V → W；三相参考相差120°；HRTIM F及第4桥臂始终关闭</text>
</svg>
